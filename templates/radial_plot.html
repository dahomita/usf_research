<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radial Author Plot</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
    }
    svg {
      display: block;
      margin: auto;
    }
    .dot {
      stroke: white;
      stroke-width: 1px;
    }
    .tooltip {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2 style="text-align: center">Radial Publication Plot by Author</h2>
  <svg width="900" height="900"></svg>
  <div class="tooltip" style="opacity:0;"></div>
  <script>
    const svg = d3.select("svg"),
      width = +svg.attr("width"),
      height = +svg.attr("height"),
      radius = Math.min(width, height) / 2 - 100;

    const g = svg.append("g").attr("transform", `translate(${width / 2},${height / 2})`);

    const color = d3.scaleSequential(d3.interpolateViridis);

    const tooltip = d3.select(".tooltip");

    // Replace this with fetch("author_data.json") in a real app
    d3.json("author_data.json").then((data) => {
      const total = data.length;
      const maxCount = d3.max(data, d => d["publication count"]);
      const angleStep = (2 * Math.PI) / (total * 0.5); // Widen the gap by reducing number of positions per full circle
      const radiusScale = d3.scaleLinear().domain([0, maxCount]).range([20, radius]);

      data.forEach((d, i) => {
        const angle = i * angleStep;
        const r = radiusScale(d["publication count"]);
        const x = Math.cos(angle - Math.PI / 2) * r;
        const y = Math.sin(angle - Math.PI / 2) * r;

        g.append("circle")
          .attr("class", "dot")
          .attr("cx", x)
          .attr("cy", y)
          .attr("r", 4)
          .attr("fill", color(i / total))
          .on("mouseover", function (event) {
            tooltip.transition().duration(200).style("opacity", 0.9);
            tooltip
              .html(`<strong>${d["author name"]}</strong><br/>Publications: ${d["publication count"]}<br/>Country: ${d.country}`)
              .style("left", event.pageX + 10 + "px")
              .style("top", event.pageY - 28 + "px");
          })
          .on("mouseout", function () {
            tooltip.transition().duration(300).style("opacity", 0);
          });

        // Optional: draw lines from center to each point
        g.append("line")
          .attr("x1", 0)
          .attr("y1", 0)
          .attr("x2", x)
          .attr("y2", y)
          .attr("stroke", color(i / total))
          .attr("stroke-opacity", 0.2);
      });
    });
  </script>
</body>
</html>
