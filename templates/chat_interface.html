<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Research Assistant</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    h1 {
      text-align: center;
    }
    #chat {
      max-width: 700px;
      margin: 20px auto;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      background: #1a1a1a;
      height: 400px;
      overflow-y: auto;
    }
    .message {
      margin: 10px 0;
    }
    .user {
      color: #90caf9;
    }
    .assistant {
      color: #a5d6a7;
    }
    #input-area {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: white;
      resize: none;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>AI Research Assistant Chat</h1>
  <div id="chat"></div>
  <div id="input-area">
    <textarea id="question" rows="2" placeholder="Ask a question about the research data..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById("chat");

    function appendMessage(role, content) {
      const msg = document.createElement("div");
      msg.className = `message ${role}`;
      msg.textContent = `${role === 'user' ? 'You' : 'AI'}: ${content}`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("question");
      const question = input.value.trim();
      if (!question) return;

      appendMessage("user", question);
      input.value = "";

      appendMessage("assistant", "Thinking...");

      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await response.json();
      document.querySelector(".assistant:last-child").textContent = `AI: ${data.answer}`;
    }
  </script>
</body>
</html>
